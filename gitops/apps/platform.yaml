# Postgres + kube-prometheus-stack via the umbrella chart. Installed first
# (sync wave -10) so Prometheus is up before app charts start emitting
# ServiceMonitors.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jarvis-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/logbrass/dev_ops.git
    targetRevision: HEAD
    path: charts/jarvis-platform
    helm:
      valueFiles:
        - ../../environments/aws/jarvis-platform.values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true       # required for the prometheus-operator CRDs
