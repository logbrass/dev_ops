apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jarvis-notes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cis1912/dev_ops.git
    targetRevision: HEAD
    path: charts/jarvis-notes
    helm:
      valueFiles:
        - ../../environments/dev/jarvis-notes.values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: jarvis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
