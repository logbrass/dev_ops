# Local dev stack. Mirrors what the Helm charts do in Kubernetes so contributors
# can iterate without spinning up Minikube. Two jarvis-web variants run side by
# side on different ports so canary-style "blue vs orange" can be compared
# without needing the cluster at all.
services:
  jarvis-web-stable:
    build:
      context: ./app/jarvis-web
    image: jarvis-web:v1.0.0
    environment:
      APP_VERSION: v1.0.0
      THEME_COLOR: "#1f6feb"
      THEME_NAME: blue
    ports:
      - "8080:8080"

  jarvis-web-canary:
    build:
      context: ./app/jarvis-web
    image: jarvis-web:v2.0.0
    environment:
      APP_VERSION: v2.0.0
      THEME_COLOR: "#f97316"
      THEME_NAME: orange
    ports:
      - "8081:8080"

  auth-service:
    build:
      context: ./app/jarvis-backend
      dockerfile: ./services/auth/Dockerfile
    env_file:
      - ./app/jarvis-backend/services/auth/docker.env
    ports:
      - "8000:8000"
    command: ["uv", "run", "fastapi", "dev", "main.py", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - db
    volumes:
      - ./app/jarvis-backend/services/auth/app:/service/app/app
      - ./app/jarvis-backend/services/auth/main.py:/service/app/main.py

  notes-service:
    build:
      context: ./app/jarvis-backend
      dockerfile: ./services/notes/Dockerfile
    env_file:
      - ./app/jarvis-backend/services/notes/docker.env
    ports:
      - "8001:8001"
    command: ["uv", "run", "fastapi", "dev", "main.py", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    depends_on:
      - db
    volumes:
      - ./app/jarvis-backend/services/notes/app:/service/app/app
      - ./app/jarvis-backend/services/notes/main.py:/service/app/main.py

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
