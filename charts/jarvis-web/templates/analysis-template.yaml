{{/*
  AnalysisTemplate: success-rate

  Argo Rollouts pauses the canary at each `analysis` step in the strategy and
  evaluates this template. We compute the fraction of HTTP responses that are
  NOT 5xx over the last minute. Anything below 95% fails the analysis and
  triggers an automatic rollback to the previous stable revision.

  The metric `http_requests_total` comes from prometheus-fastapi-instrumentator
  in app/jarvis-web/app/main.py.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  labels:
    {{- include "jarvis-web.labels" . | nindent 4 }}
spec:
  metrics:
    - name: success-rate
      interval: 15s
      count: 4   # ~1 minute window
      successCondition: result[0] >= 0.95
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(
              http_requests_total{
                job="{{ include "jarvis-web.fullname" . }}",
                status!~"5.."
              }[1m]
            ))
            /
            sum(rate(
              http_requests_total{
                job="{{ include "jarvis-web.fullname" . }}"
              }[1m]
            ))
