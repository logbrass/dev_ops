image:
  repository: ghcr.io/cis1912/jarvis-notes
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
service:
  port: 8001

env:
  AUTH_SERVICE_URL: "http://jarvis-auth-jarvis-auth:8000"
  FRONTEND_URL: "http://localhost:3000"
  DEBUG: "False"

# Optional Kubernetes Secret whose keys are exposed as environment variables.
# Use this for real environments so DATABASE_URL does not live in git.
envFromSecret: ""

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }
