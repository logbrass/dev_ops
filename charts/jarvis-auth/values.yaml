image:
  repository: ghcr.io/cis1912/jarvis-auth
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
service:
  port: 8000

env:
  FRONTEND_URL: "http://localhost:3000"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  DEBUG: "False"
  COOKIE_SECURE: "False"

# Optional Kubernetes Secret whose keys are exposed as environment variables.
# Use this for real environments so DATABASE_URL/JWT_SECRET_KEY do not live in git.
envFromSecret: ""

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }
